name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  node:
    name: node ${{ matrix.node }} on macOS
    # Not on a pull request: macOS runners are scarce, so a PR never waits for one. It runs on main after the merge, and a red run on main is the red-main alarm.
    if: github.event_name != 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [22]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      # compiles the Swift engine and the agent app for real, then runs every test
      - run: node --test test/*.test.mjs
      - run: node bin/hackamore.mjs help --json > /dev/null
  portable:
    name: logic on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      # the pure parts (pruning, addresses, schemas, diffs, the pixel layer) run anywhere; the engine tests skip off macOS
      - run: node --test test/*.test.mjs
  ci:
    name: ci
    if: always()
    needs: [node, portable]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      # The macOS job runs only on main, after the merge; a pull request is judged by the Linux job alone.
      - env:
          EVENT: ${{ github.event_name }}
          NODE: ${{ needs.node.result }}
          PORTABLE: ${{ needs.portable.result }}
        run: |
          test "$PORTABLE" = success
          if [ "$EVENT" = pull_request ]; then test "$NODE" = skipped; else test "$NODE" = success; fi
