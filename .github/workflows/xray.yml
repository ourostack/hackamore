name: Ouro AX X-ray

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  xray:
    name: Ouro AX X-ray
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22.18"
      # The CLI runs against the fixture engine (test/fixtures/engine-stub.mjs), a made-up app: never a Mac's desktop.
      # The guard proves the home is temporary before anything the CLI does is trusted.
      - name: Ouro AX X-ray
        env:
          XRAY_HOME: ${{ runner.temp }}/xray-home
        run: |
          mkdir -p xray "$XRAY_HOME"
          node scripts/inventory.mjs > inventory.json
          node lib/ouro-ui/registry/ouro/ax/xray.ts --cli "node bin/hackamore.mjs" --inventory inventory.json \
            --conformance --home "$XRAY_HOME" --env "HACKAMORE_ENGINE_STUB=$GITHUB_WORKSPACE/test/fixtures/engine-stub.mjs" --env "RUNNER_TEMP=$RUNNER_TEMP" \
            --guard "node scripts/assert-mock.mjs" --state "help --json" --commit "$GITHUB_SHA" \
            --sample action=press_key --sample steps='[{"action":"press_key","input":{"key":"a"}}]' --sample file=journey.json \
            --json --md xray/xray.md > xray/report.json
      - name: Gate on the must claims
        if: always()
        run: |
          node -e '
            const r = JSON.parse(require("fs").readFileSync("xray/report.json", "utf8"));
            const { must, mustHolding } = r.summary;
            if (!(must > 0) || mustHolding !== must) {
              console.error(`must claims holding: ${mustHolding} of ${must}; every must claim has to hold`);
              process.exit(1);
            }
            console.log(`every must claim holds: ${mustHolding} of ${must}`);
          '
      - name: Action claims
        if: always()
        run: |
          mkdir -p xray-actions
          node tools/ouro-actions/ouro-actions.mts check actions/hackamore.actions.mts actions/generated \
            --report xray-actions/report.json --app "Hackamore" --commit "$GITHUB_SHA"
          node -e "const s = require('./xray-actions/report.json').summary; if (!s) process.exit(1); if (s.mustHolding !== s.must) { console.error('Action claims: ' + s.mustHolding + ' of ' + s.must + ' must claims hold'); process.exit(1); }"
      - name: Upload the X-ray
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xray
          path: xray/
      - name: Upload the action claims
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: actions-xray
          path: xray-actions/
